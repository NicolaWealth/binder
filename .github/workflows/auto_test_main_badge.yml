# Workflow Name
name: Tests Passing
# Set Event Which Triggers Workflow
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    # Using Ubuntu
    runs-on: ubuntu-latest 
    container:
      # Using Node JS Version 22
      image: node:22 
    steps:
      # Checkout Code    
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Install Dependencies          
      - run: npm ci
      # Run Tests      
      - run: npm test
      # Run Build Script      
      - run: npm run build
